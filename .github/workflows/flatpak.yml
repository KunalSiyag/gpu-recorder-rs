name: Flatpak

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  bundle:
    name: Build Flatpak bundle
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: hypergsr.flatpak
          manifest-path: packaging/flatpak/io.github.KunalSiyag.gpu_recorder_rs.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/**') }}
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: hypergsr-flatpak
          path: hypergsr.flatpak
          if-no-files-found: error

  release:
    name: Attach bundle to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hypergsr-flatpak
      - name: Upload hypergsr.flatpak
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" hypergsr.flatpak --clobber
