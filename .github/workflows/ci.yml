name: Rust CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  npm-tests:
    name: npm launcher (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  build-and-test:
    name: Build & Test (Ubuntu Wayland/GTK4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Wayland, GTK4, DRM & PipeWire dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config clang ffmpeg \
            libgtk-4-dev libdrm-dev libx11-dev \
            libpipewire-0.3-dev libportal-dev \
            meson ninja-build libwayland-dev libwayland-bin wayland-protocols

      # libgtk4-layer-shell-dev is not packaged for Ubuntu 24.04 (noble).
      # Default /usr/local prefix matches the path src/gui.rs and src/main.rs dlopen.
      - name: Build gtk4-layer-shell from source
        run: |
          git clone --depth 1 --branch v1.3.0 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
          cd /tmp/gtk4-layer-shell
          meson setup build -Dexamples=false -Ddocs=false -Dtests=false -Dintrospection=false -Dvapi=false
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Install Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Registry & Target
        uses: Swatinem/rust-cache@v2

      - name: Build Native PipeWire Portal Helper
        run: |
          mkdir -p bin
          gcc -O2 -Wall src/pw_portal_capture.c -o bin/hypergsr-pw-capture \
            $(pkg-config --cflags --libs libportal libpipewire-0.3 gio-2.0) -lpthread

      - name: Run Unit Tests
        run: cargo test --verbose

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Release Binary and npm Package
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Smoke Test Installed npm Package
        run: |
          npm install --prefix "$RUNNER_TEMP/hypergsr-smoke" --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/hypergsr-*.tgz
          cd "$RUNNER_TEMP"
          ./hypergsr-smoke/node_modules/.bin/hypergsr --version
          ./hypergsr-smoke/node_modules/.bin/hypergsr --report

      - uses: actions/upload-artifact@v4
        with:
          name: hypergsr-npm-linux-x64
          path: ${{ runner.temp }}/hypergsr-*.tgz
