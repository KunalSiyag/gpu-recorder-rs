<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="barRust" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="barObs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="barElectron" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="320" rx="18" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5"/>

  <text x="36" y="42" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800">
    Real-World Resource Footprint &amp; Latency Benchmark (1080p @ 60 FPS)
  </text>
  <text x="36" y="64" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12.5">
    Measured on Linux Wayland (COSMIC / GNOME / Hyprland) with Hybrid AMD Radeon + NVIDIA RTX 3050 Laptop GPU
  </text>

  <!-- Left Side: Memory Footprint Bars -->
  <g transform="translate(36, 96)">
    <text x="0" y="0" fill="#CBD5E1" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">MEMORY FOOTPRINT (RSS MB — LOWER IS BETTER)</text>

    <!-- HyperGSR -->
    <text x="0" y="34" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="700">HyperGSR (Native Rust)</text>
    <rect x="200" y="19" width="44" height="20" rx="6" fill="url(#barRust)"/>
    <text x="254" y="34" fill="#10B981" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">56 MB  ⚡ (11× lighter)</text>

    <!-- OBS Studio -->
    <text x="0" y="76" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">OBS Studio (Qt6 + Plugins)</text>
    <rect x="200" y="61" width="245" height="20" rx="6" fill="url(#barObs)"/>
    <text x="455" y="76" fill="#CBD5E1" font-family="JetBrains Mono, monospace" font-size="12.5">340 MB</text>

    <!-- Screen Studio / Electron Recorders -->
    <text x="0" y="118" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Electron Studio Recorders</text>
    <rect x="200" y="103" width="410" height="20" rx="6" fill="url(#barElectron)"/>
    <text x="620" y="118" fill="#F87171" font-family="JetBrains Mono, monospace" font-size="12.5">650+ MB</text>
  </g>

  <!-- Bottom Highlight Strip -->
  <g transform="translate(36, 246)">
    <rect x="0" y="0" width="1028" height="46" rx="10" fill="#111A2E" stroke="#1E3A5F" stroke-width="1"/>
    <text x="20" y="28" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">
      ✓ Zero-Root DRM Plane #92 Cursor Tracking    •    ✓ Self-Registering Custom Zoom Combos    •    ✓ Native Wayland Layer-Shell HUD    •    ✓ Standalone PipeWire + NVENC
    </text>
  </g>
</svg>
