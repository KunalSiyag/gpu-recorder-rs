<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <linearGradient id="solarSpectrum" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb931" stop-opacity="0.9"/>
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="75%" stop-color="#2e73fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="subtleGlow" cx="76%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#2e73fc" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#ffb931" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dovetailGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#1c1c1c" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Graphite Obsidian Canvas (#0a0a0a) with 10px radius and #262626 1px hairline -->
  <rect width="1200" height="420" rx="10" fill="#0a0a0a"/>
  <rect width="1200" height="420" rx="10" fill="url(#dovetailGrid)" opacity="0.75"/>
  <rect width="1200" height="420" rx="10" fill="url(#subtleGlow)"/>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="9.5" fill="none" stroke="#262626" stroke-width="1"/>

  <!-- Top Spectral Signal Rule -->
  <rect x="1" y="1" width="1198" height="1.5" fill="url(#solarSpectrum)" opacity="0.85"/>

  <!-- Ossium Blueprint Corner + Markers -->
  <g stroke="#464646" stroke-width="1.2">
    <path d="M 20 14 L 20 26 M 14 20 L 26 20"/>
    <path d="M 1180 14 L 1180 26 M 1174 20 L 1186 20"/>
    <path d="M 20 394 L 20 406 M 14 400 L 26 400"/>
    <path d="M 1180 394 L 1180 406 M 1174 400 L 1186 400"/>
  </g>

  <!-- Top Center Wayland Layer-Shell Dynamic Island Shell -->
  <g transform="translate(300, 22)">
    <rect x="0" y="0" width="600" height="42" rx="10" fill="#111111" stroke="#262626" stroke-width="1"/>
    <!-- Live Status Dot -->
    <circle cx="22" cy="21" r="4.5" fill="#ef4444"/>
    <text x="36" y="25" fill="#fafafa" font-family="Geist, Inter, system-ui, sans-serif" font-size="13" font-weight="600">HyperGSR</text>
    <text x="106" y="25" fill="#a1a1a1" font-family="Geist Mono, JetBrains Mono, monospace" font-size="12">00:42</text>

    <line x1="154" y1="10" x2="154" y2="32" stroke="#262626" stroke-width="1"/>

    <!-- DRM Telemetry Tag -->
    <rect x="166" y="8" width="176" height="26" rx="4" fill="#171717" stroke="#262626" stroke-width="1"/>
    <circle cx="179" cy="21" r="3.5" fill="#3fb950"/>
    <text x="190" y="25" fill="#d4d4d4" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" font-weight="500">DRM #92 X:64% Y:38%</text>

    <!-- Active Spring Zoom Tag -->
    <rect x="350" y="8" width="96" height="26" rx="4" fill="#171717" stroke="#464646" stroke-width="1"/>
    <text x="398" y="25" text-anchor="middle" fill="#fafafa" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" font-weight="500">2.00x AUTO</text>

    <!-- Pale Primary Control -->
    <rect x="456" y="8" width="64" height="26" rx="6" fill="#e5e5e5"/>
    <text x="488" y="25" text-anchor="middle" fill="#171717" font-family="Geist, Inter, system-ui, sans-serif" font-size="11.5" font-weight="600">Record</text>

    <!-- Charcoal Secondary Control -->
    <rect x="528" y="8" width="62" height="26" rx="6" fill="#262626" stroke="#464646" stroke-width="1"/>
    <text x="559" y="25" text-anchor="middle" fill="#fafafa" font-family="Geist, Inter, system-ui, sans-serif" font-size="11.5" font-weight="500">Studio</text>
  </g>

  <!-- Left Column: Graphite Display Typography & Blueprint Telemetry -->
  <g transform="translate(56, 108)">
    <!-- Resend Status Eyebrow -->
    <circle cx="6" cy="8" r="4" fill="#3fb950"/>
    <text x="18" y="12" fill="#a1a1a1" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="1.2">RUST • WAYLAND + X11 • PIPEWIRE • NVENC / VAAPI</text>

    <!-- Tight 500-weight Display Heading -->
    <text x="0" y="62" fill="#fafafa" font-family="Geist, Inter, system-ui, sans-serif" font-size="42" font-weight="500" letter-spacing="-1.3">The camera follows your cursor.</text>
    <text x="0" y="112" fill="#808080" font-family="Geist, Inter, system-ui, sans-serif" font-size="42" font-weight="500" letter-spacing="-1.3">On Wayland, in 56 MB.</text>

    <text x="0" y="150" fill="#a1a1a1" font-family="Geist, Inter, system-ui, sans-serif" font-size="15.5" font-weight="400">Reads the cursor from the DRM hardware cursor plane without root,</text>
    <text x="0" y="172" fill="#a1a1a1" font-family="Geist, Inter, system-ui, sans-serif" font-size="15.5" font-weight="400">then moves a critically damped spring camera to where you work.</text>

    <!-- Dashed Blueprint Telemetry Strip -->
    <g transform="translate(0, 200)">
      <rect x="0" y="0" width="640" height="74" rx="10" fill="#111111" stroke="#262626" stroke-width="1"/>
      <line x1="160" y1="0" x2="160" y2="74" stroke="#262626" stroke-width="1" stroke-dasharray="4 4"/>
      <line x1="320" y1="0" x2="320" y2="74" stroke="#262626" stroke-width="1" stroke-dasharray="4 4"/>
      <line x1="480" y1="0" x2="480" y2="74" stroke="#262626" stroke-width="1" stroke-dasharray="4 4"/>

      <text x="20" y="26" fill="#808080" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10.5" letter-spacing="0.8">MEMORY RSS</text>
      <text x="20" y="54" fill="#fafafa" font-family="Geist Mono, JetBrains Mono, monospace" font-size="22" font-weight="500">56 MB</text>

      <text x="180" y="26" fill="#808080" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10.5" letter-spacing="0.8">CPU @ 1080P60</text>
      <text x="180" y="54" fill="#3fb950" font-family="Geist Mono, JetBrains Mono, monospace" font-size="22" font-weight="500">&lt; 1.5%</text>

      <text x="340" y="26" fill="#808080" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10.5" letter-spacing="0.8">WAYLAND CURSOR</text>
      <text x="340" y="54" fill="#fafafa" font-family="Geist Mono, JetBrains Mono, monospace" font-size="22" font-weight="500">DRM #92</text>

      <text x="500" y="26" fill="#808080" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10.5" letter-spacing="0.8">CAMERA SOLVER</text>
      <text x="500" y="54" fill="#fafafa" font-family="Geist Mono, JetBrains Mono, monospace" font-size="22" font-weight="500">240 Hz ODE</text>
    </g>
  </g>

  <!-- Right Column: Graphite Hollow Luminous Aperture Lattice & Product Demo Frame -->
  <g transform="translate(744, 96)">
    <rect x="0" y="0" width="400" height="286" rx="10" fill="#000000" stroke="#262626" stroke-width="1"/>
    <rect x="1" y="1" width="398" height="284" rx="9" fill="none" stroke="#464646" stroke-width="0.5" opacity="0.5"/>

    <!-- Top Frame Header -->
    <text x="16" y="24" fill="#a1a1a1" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11" letter-spacing="0.6">OPTICAL BENCH • 16:9 SPRING CROP</text>
    <text x="384" y="24" text-anchor="end" fill="#3fb950" font-family="Geist Mono, JetBrains Mono, monospace" font-size="11">● NVENC P4 CFR</text>
    <line x1="0" y1="36" x2="400" y2="36" stroke="#262626" stroke-width="1"/>

    <!-- Hollow Rotated Rounded-Square Lattice (Graphite Luminous Polygon Spec) -->
    <g transform="translate(200, 144)">
      <rect x="-120" y="-68" width="240" height="136" rx="12" fill="none" stroke="#262626" stroke-width="1" transform="rotate(-4)"/>
      <rect x="-104" y="-58" width="208" height="116" rx="10" fill="none" stroke="#464646" stroke-width="1" stroke-dasharray="4 4" transform="rotate(3)"/>
      <rect x="-86" y="-48" width="172" height="96" rx="10" fill="none" stroke="url(#solarSpectrum)" stroke-width="1.5"/>
      <!-- Optical Crosshair & Cursor Plane #92 Point -->
      <line x1="-18" y1="0" x2="18" y2="0" stroke="#fafafa" stroke-width="1" opacity="0.5"/>
      <line x1="0" y1="-18" x2="0" y2="18" stroke="#fafafa" stroke-width="1" opacity="0.5"/>
      <circle cx="0" cy="0" r="4" fill="#3fb950"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#fafafa" stroke-width="1" stroke-dasharray="2 2"/>
      <text x="-76" y="-32" fill="#fafafa" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10">CROP 2.00x • ζ = 1.00</text>
    </g>

    <!-- Bottom ODE Telemetry Strip -->
    <line x1="0" y1="236" x2="400" y2="236" stroke="#262626" stroke-width="1"/>
    <path d="M 18 278 C 78 278, 96 264, 156 264 L 248 264 C 296 264, 318 278, 382 278" fill="none" stroke="url(#solarSpectrum)" stroke-width="1.75"/>
    <text x="18" y="252" fill="#808080" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10.5">a = -k(x - target) - 2*sqrt(k)*v</text>
    <text x="382" y="252" text-anchor="end" fill="#ff8833" font-family="Geist Mono, JetBrains Mono, monospace" font-size="10.5">src/zoom_engine.rs →</text>
  </g>
</svg>
