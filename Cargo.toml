[package]
name = "gpu-recorder-rs"
version = "1.0.1"
edition = "2021"
license = "MIT"
readme = "README.md"
repository = "https://github.com/KunalSiyag/gpu-recorder-rs"
homepage = "https://kunalsiyag.github.io/gpu-recorder-rs/"
keywords = ["screen-recorder", "wayland", "pipewire", "gpu", "gtk4"]
categories = ["multimedia::video", "gui", "os::linux-apis"]
description = "Screen recorder for Linux Wayland whose camera follows your cursor: rootless DRM cursor tracking, spring-physics auto-zoom, NVENC/VAAPI encoding"

[[bin]]
name = "gpu-recorder-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
crossbeam-channel = "0.5.15"
gdk4 = "0.11.2"
gio = "0.22.4"
gl = "0.14.0"
glam = "0.32.1"
glib = "0.22.4"
gtk4 = { version = "0.11.2", features = ["v4_10"] }
cairo-rs = "0.22.0"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }
libc = "0.2.186"
parking_lot = "0.12.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
x11-dl = "2.21.0"
